<!doctype html>
<body>
  <script>
    function calcularFactorial(valor) {

      // Si el numero es 0, retorna 1
      if (valor === 0) {
        return 1;
      }

      // Validacion para numeros negativos
      if (valor < 0) {
        return "No es posible calcular el factorial de un número negativo";
      }

      let acumulador = 1;

      // Recorre desde 1 hasta el numero
      for (let contador = 1; contador <= valor; contador++) {

        // Multiplica el acumulador por el contador
        acumulador = acumulador * contador;
      }

      return acumulador;
    }

    // Casos de prueba
    console.log(calcularFactorial(3)); // 6
    console.log(calcularFactorial(5)); // 120
    console.log(calcularFactorial(-2)); // No es posible calcular el factorial de un numero negativo
    console.log(calcularFactorial(7)); // 5040

  </script>
</body>
