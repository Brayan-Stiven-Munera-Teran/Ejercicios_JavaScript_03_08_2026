<!doctype html>
<body>
  <script>
    function contarVocales(cadena) {
      let total = 0;

      // Recorre el texto con un bucle for
      for (let posicion = 0; posicion < cadena.length; posicion++) {

        // Obtiene el carácter actual en minúscula
        letra = cadena[posicion].toLowerCase();

        // Comprueba si es una vocal
        if (
          letra === "a" ||
          letra === "e" ||
          letra === "i" ||
          letra === "o" ||
          letra === "u"
        ) {
          total++;
        }
      }

      return total;
    }

    // Casos de prueba
    console.log(contarVocales("Computadora")); // 5
    console.log(contarVocales("Elefante")); // 4
    console.log(contarVocales("Universidad")); // 5
  </script>
</body>
