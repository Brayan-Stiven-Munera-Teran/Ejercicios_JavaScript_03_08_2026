<!doctype html>
<body>
  <script>
    function convertirBinario(valor) {

      if (valor === 0) {
        return "0";
      }

      let resultado = "";

      while (valor > 0) {

        resto = valor % 2;

        resultado = resto + resultado;

        valor = Math.floor(valor / 2);
      }

      return resultado;
    }

    // Casos de prueba
    console.log(convertirBinario(2));   // "10"
    console.log(convertirBinario(8));   // "1000"
    console.log(convertirBinario(12));  // "1100"
    console.log(convertirBinario(20));  // "10100"

  </script>
</body>
