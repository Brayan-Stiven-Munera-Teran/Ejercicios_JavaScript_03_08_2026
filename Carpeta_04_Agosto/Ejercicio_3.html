<!doctype html>
<body>
  <script>
    function generarFibonacci(limite) {
      const numeros = [];

      if (limite <= 0) {
        return numeros;
      } else if (limite === 1) {
        return [0];
      }

      let primero = 0;
      let segundo = 1;

      for (let posicion = 1; posicion < limite; posicion++) {
        numeros.push(primero);

        siguienteNumero = primero + segundo;
        primero = segundo;
        segundo = siguienteNumero;
      }

      return numeros;
    }

    // Casos de prueba
    console.log(generarFibonacci(2)); // [0, 1]
    console.log(generarFibonacci(6)); // [0, 1, 1, 2, 3, 5]
    console.log(generarFibonacci(8)); // [0, 1, 1, 2, 3, 5, 8, 13]

  </script>
</body>
