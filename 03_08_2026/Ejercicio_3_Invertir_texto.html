<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - Invertir texto y verificar palíndromos</title>
</head>

<body>

    <script>

        // Funcion para invertir un texto
        function invertirTexto(texto) {

            return texto.split("").reverse().join("");

        }

        // Funcion para verificar si un texto es un palindromo
        function esPalindromo(texto) {

            let textoNormalizado = texto.toLowerCase().replace(/\s/g, "");

            let textoInvertido = invertirTexto(textoNormalizado);

            if (textoNormalizado === textoInvertido) {
                return true;
            } else {
                return false;
            }

        }

        console.log(invertirTexto("JavaScript"));

        console.log(esPalindromo("RECONOCER"));

        console.log(esPalindromo("Anita lava la tina"));

        console.log(esPalindromo("Hola"));

    </script>

</body>

</html>
