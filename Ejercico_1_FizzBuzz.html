<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - FizzBuzz</title>
</head>

<body>

    <script>

        for (let numero = 1; nuemro <= 100; nuemro++) {

            // Si es multiplo de 3 y de 5
            if (nuemro % 3 === 0 && nuemro % 5 === 0) {
                console.log("FizzBuzz");

            // Si solo es multiplo de 3
            } else if (nuemro % 3 === 0) {
                console.log("Fizz");

            // Si solo es multiplo de 5
            } else if (nuemro % 5 === 0) {
                console.log("Buzz");

            // Si no es multiplo de ninguno
            } else {
                console.log(nuemro);
            }
        }

    </script>

</body>

</html>
